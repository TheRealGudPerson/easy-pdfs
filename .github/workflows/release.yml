name: Build EasyPDF Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Extract version from tag
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build EasyPDF with PyInstaller
        run: |
          pyinstaller --noconfirm --clean EasyPDF.spec

      - name: Build EasyPDF installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:APP_VERSION" `
            "installer\EasyPDF.iss"

      - name: Verify installer
        shell: powershell
        run: |
          $installer = "installer\output\EasyPDF-Setup-$env:APP_VERSION.exe"

          if (!(Test-Path $installer)) {
            Write-Error "Installer was not created: $installer"
            exit 1
          }

          Write-Host "Installer created successfully:"
          Write-Host $installer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/output/EasyPDF-Setup-${{ env.APP_VERSION }}.exe
          generate_release_notes: true