name: Build EasyPDF Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ============================================================
  # Windows
  # ============================================================

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Extract version from tag
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build EasyPDF with PyInstaller
        run: |
          pyinstaller --noconfirm --clean EasyPDF.spec

      - name: Verify PyInstaller output
        shell: powershell
        run: |
          Write-Host "Contents of dist:"
          Get-ChildItem -Path "dist" -Recurse

          if (!(Test-Path "dist\EasyPDF.exe")) {
            Write-Error "PyInstaller did not create dist\EasyPDF.exe"
            exit 1
          }

          Write-Host "PyInstaller output verified."

      - name: Build EasyPDF installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:APP_VERSION" `
            "installer\EasyPDF.iss"

      - name: Verify installer
        shell: powershell
        run: |
          $installer = "installer\output\EasyPDF-Setup-$env:APP_VERSION.exe"

          if (!(Test-Path $installer)) {
            Write-Error "Installer was not created: $installer"
            exit 1
          }

          Write-Host "Installer created successfully:"
          Write-Host $installer

      - name: Upload Windows installer
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/output/EasyPDF-Setup-${{ env.APP_VERSION }}.exe
          generate_release_notes: true


  # ============================================================
  # macOS
  # ============================================================

  build-macos:
    name: Build macOS Application
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Extract version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build EasyPDF with PyInstaller
        run: |
          pyinstaller --noconfirm --clean EasyPDF.spec

      - name: Verify PyInstaller output
        run: |
          echo "Contents of dist:"
          find dist -maxdepth 3 -print

          if [ ! -d "dist/EasyPDF.app" ]; then
            echo "PyInstaller did not create dist/EasyPDF.app"
            exit 1
          fi

          echo "PyInstaller output verified."

      - name: Create DMG
        run: |
          mkdir -p dmg

          hdiutil create \
            -volname "EasyPDF" \
            -srcfolder "dist/EasyPDF.app" \
            -ov \
            -format UDZO \
            "dmg/EasyPDF-${APP_VERSION}.dmg"

      - name: Verify DMG
        run: |
          if [ ! -f "dmg/EasyPDF-${APP_VERSION}.dmg" ]; then
            echo "DMG was not created."
            exit 1
          fi

          echo "DMG created successfully:"
          ls -lh "dmg/EasyPDF-${APP_VERSION}.dmg"

      - name: Upload macOS installer
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dmg/EasyPDF-${{ env.APP_VERSION }}.dmg